name: Cluster Quality Audit

on:
  schedule:
    # 03:00 UTC daily — off-peak, well clear of the hourly ingest/cluster
    # drains. workflow_dispatch below covers ad-hoc runs.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

# Read-only checkout + a Supabase write via the service-role key passed as
# a secret env var, not a token grant — the job needs no GITHUB_TOKEN
# permissions beyond checking out the repo.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The next step holds the service-role key: leave no git token in
          # .git/config for anything that runs after the checkout.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Match ci.yml's pin to the Node 24 family.
          node-version: 24
          cache: npm

      # --no-audit: npm ci's built-in audit request stalled PR runs for npm's
      # full 300 s fetch timeout (2026-10-22); the advisory gate is the separate
      # dep-audit.yml workflow.
      #
      # --omit=dev --ignore-scripts: the next steps receive SUPABASE_SERVICE_ROLE_KEY,
      # so no dependency install script may run in this job. The import closure
      # of scripts/audit-clusters.mjs (scripts/lib/{audit,cluster}/*.mjs) needs
      # only the production dependency @supabase/supabase-js (checked
      # 2026-11-02: it resolves and loads from a --omit=dev --ignore-scripts
      # install). A new bare import there must be a `dependencies` entry.
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefer-offline

      # A non-zero exit now fails the job on purpose (see the --persist
      # exit-code contract documented at the top of audit-clusters.mjs) —
      # that failure notification is the pager for the zero-output alarm.
      # The `if: always()` upload below still preserves audit-report.json
      # for triage even when this step fails.
      - name: Run cluster quality audit
        env:
          # scripts/audit-clusters.mjs reads SUPABASE_URL directly (falls
          # back to NEXT_PUBLIC_SUPABASE_URL for local dev).
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Gates the zero-output alarm's neutral-title check (see
          # scripts/lib/audit/zero-output.mjs). Until this secret is added
          # to the repo, the check stays a no-op (prints "skipped", job
          # still green) — it activates the day ANTHROPIC_API_KEY is set.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/audit-clusters.mjs --json --persist > audit-report.json

      # always() so a --persist failure (report already computed/printed)
      # still preserves the JSON for triage instead of skipping the upload.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cluster-quality-report
          path: audit-report.json
          if-no-files-found: ignore
          retention-days: 30
