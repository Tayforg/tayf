name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The job only checks out, installs, lints, type-checks, and tests — none of
# which write back to the repo or its security surfaces. Pin GITHUB_TOKEN to
# least privilege so a compromised dependency can't escalate.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Match the project's declared engines and README ("Node.js 24+").
          # Next 16 + React 19 require >=18.18 to run, but the worker-stream
          # codebase has only been smoke-tested on the Node 24 family. Pin
          # the major to keep CI honest with local dev.
          node-version: 24
          cache: npm

      # --no-audit: npm ci's built-in audit request stalled PR runs for npm's
      # full 300 s fetch timeout (2026-10-22); the advisory gate is the separate
      # dep-audit.yml workflow.
      #
      # No --ignore-scripts here: the lint step needs unrs-resolver's install
      # script (it fetches its native binding), and this job is given no
      # repository secret to steal.
      - run: npm ci --no-audit --no-fund --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mirrors the `check` job: read-only, so least-privilege token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-deno@v2 is a BRANCH, never a tag: pin the release commit.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Match supabase/config.toml's deno_version (Deno 2 major) — the
          # Edge Functions run on whatever the Supabase platform ships for
          # that major, so pin the same one here rather than "latest".
          deno-version: "2"

      # Every function, not a hand-kept list: a new folder with an index.ts is
      # checked from its first commit. `--no-lock` because deno.lock is never
      # committed (repo rule); each function is checked from its own folder so
      # its deno.json import map applies, exactly as the deploy bundles it.
      - name: deno check every edge function
        run: |
          set -euo pipefail
          for entry in supabase/functions/*/index.ts; do
            dir="$(dirname "$entry")"
            name="$(basename "$dir")"
            echo "deno check: $name"
            (cd "$dir" && deno check --no-lock index.ts)
          done

  # `next build` on every PR and push to main (h31-deps-1). lint, tsc and vitest never run the
  # production build, and PRs get no Vercel preview build, so a prerender / Cache Components error
  # was first seen AFTER the merge, where it blocks the deploy pipeline: production builds
  # dpl_8ZSJ62dS7uQFjD8HfXT1fGoGqDED (5ca5d00, PR #138) and dpl_DWEeSk7D3VmUoGyawse3WCwM6yFG (cb41a4a)
  # of merged main commits both failed that way.
  #
  # Measured locally before this job was written (Node 24, fresh `npm ci --ignore-scripts`, ~14 s
  # build, ~5 s install): with NO service-role key every server read throws before it creates a
  # client ("Missing NEXT_PUBLIC_SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY"), the cache-resilience
  # layer turns that into the empty-state render, and the build passes. So the job makes no request
  # to any database, and the NEXT_PUBLIC_* values below only get inlined into the client bundle the
  # way a production build inlines them. The same check run on cb41a4a fails in the prerender; it
  # does not cover failures that need real rows or a slow database.
  #
  # Least privilege: read-only token, no repository secret, no service-role key, no Sentry variable
  # (without an auth token the Sentry plugin uploads nothing). The three NEXT_PUBLIC_* values are
  # repository VARIABLES (publishable values that ship to every browser); an unset variable is an
  # empty string and the build still passes. This job runs the PR's own next.config.ts and every
  # dependency, which is why it has nothing worth stealing.
  #
  # --ignore-scripts: the only install scripts in the tree are unrs-resolver's native-binding
  # download (the ESLint import resolver, needed by the `check` job's lint step, not by the build)
  # and fsevents (macOS only); `next build` runs without them.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Mirrors the `check` job: read-only, so least-privilege token.
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # --no-audit: see the `check` job.
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - name: Build
        run: npx next build

      # h159-perf-1: experimental.inlineCss must have put the sheet into every
      # prerendered shell (a <style data-precedence="next">, no stylesheet <link>)
      # with only absolute font urls. Reads .next/server/app/**/*.html; no network.
      - name: Inline CSS check
        run: node scripts/check-inline-css.mjs

  # The live-Postgres migration tests (describe.runIf on TAYF_PSQL, tests/migrations/*.test.ts).
  # Without this job a broken live block only ever showed as "skipped". The runner builds a fresh
  # throwaway database per test file from tests/migrations/sql/stub.sql and
  # tests/migrations/sql/live-manifest.txt, runs the dry-run scripts, then vitest, and fails on a
  # setup error, a failed test, a file with no passing test or an unexpected skip.
  live-db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Mirrors the `check` job: read-only, so least-privilege token.
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:15
        env:
          # Throwaway CI container reachable only from this job: no password, no data worth protecting.
          POSTGRES_HOST_AUTH_METHOD: trust
          # Production's datcollate is en_US.UTF-8 (migration 129's header).
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    # run-live.sh refuses any PGHOST that is not local; it creates and drops databases.
    env: { PGHOST: localhost, PGPORT: "5432", PGUSER: postgres, TAYF_PG_EXTERNAL: "1" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: this job never needs an install script (vitest only). It is given no
      # repository credential either, but there is no reason to run dependency scripts next to a
      # database. --no-audit: see the `check` job.
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline

      - run: psql --version

      - name: Live Postgres migration tests
        run: bash tests/migrations/sql/run-live.sh
