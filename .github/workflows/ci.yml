name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The job only checks out, installs, lints, type-checks, and tests — none of
# which write back to the repo or its security surfaces. Pin GITHUB_TOKEN to
# least privilege so a compromised dependency can't escalate.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the project's declared engines and README ("Node.js 24+").
          # Next 16 + React 19 require >=18.18 to run, but the worker-stream
          # codebase has only been smoke-tested on the Node 24 family. Pin
          # the major to keep CI honest with local dev.
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

  deno:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Mirrors the `check` job: read-only, so least-privilege token.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          # Match supabase/config.toml's deno_version (Deno 2 major) — the
          # Edge Functions run on whatever the Supabase platform ships for
          # that major, so pin the same one here rather than "latest".
          deno-version: "2"

      - name: deno check ingest
        working-directory: supabase/functions/ingest
        run: deno check index.ts

      - name: deno check cluster-consumer
        working-directory: supabase/functions/cluster-consumer
        run: deno check index.ts

      - name: deno check image-consumer
        working-directory: supabase/functions/image-consumer
        run: deno check index.ts
