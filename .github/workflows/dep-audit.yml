name: Dependency Audit

# Advisory gate for the PRODUCTION dependency tree (h27-supply-1). Dependabot
# alerts are off on this repo, and nothing else ran `npm audit`, so a published
# advisory on a runtime dependency (Next.js, React, Supabase, Sentry) went
# unnoticed until someone looked.
#
# A separate workflow on purpose: ci.yml installs with --no-audit because npm
# ci's built-in audit request stalled PR runs for npm's full 300 s fetch
# timeout (2026-10-22). Here a stalled registry can only hold THIS check (10
# minute cap), never the CI check, and it runs only when the dependency
# manifests change plus once a week, so a new advisory on an unchanged
# lockfile still turns it red.
#
# --omit=dev: only what runs in production is gated (the dev-only toolchain
# has its own, build-time advisories). That includes the edge runtime:
# fast-xml-parser (and its strnum dependency) parses untrusted feeds inside the
# ingest edge function, which holds the service-role key. The function imports
# it from esm.sh, so the npm copy exists to be audited and to run the unit
# tests against the same version; it is therefore listed under `dependencies`,
# not `devDependencies`, or this gate would skip it (tests/guards/ci-dep-audit
# and edge-deps-pinned pin both). --ignore-scripts: audit needs the lockfile
# only, so no dependency lifecycle script runs in this job.
#
# Two more jobs close blind spots of `npm audit` (h31-deps-1):
#   * next-advisories: `npm audit` reads GitHub's GLOBAL advisory database, and
#     the Next.js 16.4.5 security release was not in it (GHSA-mfr8-8qww-v76h is
#     published on vercel/next.js with an empty patched_versions, while
#     /advisories/GHSA-mfr8-8qww-v76h is a 404), so the audit job above stayed
#     green on 16.4.3. scripts/next-advisory-check.mjs reads the repository
#     advisories of vercel/next.js directly and fails when one covers the
#     installed version and has no recorded fix. It runs no install (Node
#     built-ins only) and fails closed when GitHub cannot be read. Its runbook
#     (what to do when it goes red) is in the script's header; the offline
#     twin is tests/guards/next-security-floor.test.ts.
#   * edge-audit: the Edge Functions import npm:@supabase/supabase-js and
#     npm:@sentry/deno (Deno resolves them at deploy time; deno.lock is never
#     committed) and fast-xml-parser through esm.sh. Those versions are not the
#     ones package.json installs, so the audit above never saw them.
#     scripts/edge-audit/package.json lists exactly the edge pins
#     (tests/guards/edge-npm-audited.test.ts keeps it equal to the code); the
#     job generates a lockfile for it (that directory has none committed, so its
#     setup-node has no cache) and audits it at high severity.
# Every job: 10 minute cap or less, credential-free checkout, no repository
# secret; the only token is the workflow's own read-only GITHUB_TOKEN, given to
# the advisory check for the API rate limit.
on:
  schedule:
    # Mondays 04:17 UTC, clear of the 03:00 cluster audit and the :00/:30
    # heartbeat.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}
  pull_request:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - scripts/edge-audit/**
      - scripts/next-advisory-check.mjs
      - supabase/functions/**
      - .github/workflows/dep-audit.yml
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - scripts/edge-audit/**
      - scripts/next-advisory-check.mjs
      - supabase/functions/**
      - .github/workflows/dep-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Match ci.yml's pin to the Node 24 family.
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      # Fails on a high or critical advisory in a production dependency.
      - run: npm audit --omit=dev --audit-level=high

  # Published Next.js advisories vs the version package-lock.json installs.
  next-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache and no install: the script uses Node built-ins only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The workflow's own read-only token, only so the API call is authenticated
      # (rate limit). The script sends it to api.github.com and nowhere else.
      - name: Check Next.js security advisories
        run: node scripts/next-advisory-check.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The npm packages the Edge Functions pin, audited at their exact versions.
  edge-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/edge-audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `cache:` on purpose: setup-node's npm cache keys on a lockfile, and
      # scripts/edge-audit has none committed (it is generated below).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Resolves the pinned packages and their dependencies into a lockfile
      # without installing anything or running a lifecycle script.
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      # Fails on a high or critical advisory in an edge package or any of its
      # dependencies.
      - run: npm audit --audit-level=high
