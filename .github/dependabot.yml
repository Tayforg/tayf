version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The edge runtime pins these two exactly (4.5.7 / 1.1.2) and their next
      # majors are ESM-only: tests/guards/edge-deps-pinned and ci-dep-audit
      # reject them by design (see the major-bump PRs #182 and #183). Minor and
      # patch updates still arrive.
      - dependency-name: fast-xml-parser
        update-types: ["version-update:semver-major"]
      - dependency-name: strnum
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # codeql.yml pins github/codeql-action/init and /analyze, which must stay on one commit. Without a group
      # Dependabot opens one PR per action path (#258, #259), each moving a single step: both fail CI (the pin
      # guard and CodeQL's own version-mismatch check) and can never merge. One group, no update-types filter, so
      # a major release also lands as a single PR.
      codeql-action:
        patterns:
          - "github/codeql-action"
          - "github/codeql-action/*"
